name: Verilog/SystemVerilog Syntax Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator

    - name: Check Verilog/SystemVerilog syntax
      run: |
        # 1. 定义包含路径 (Include Paths)
        # 告诉 Verilator 去哪里找模块定义
        INC_FLAGS=$(find modules projects -type d -name "rtl" | sed 's/^/-I/')
        
        # 2. 批量检查逻辑
        # 对于 Testbench (.sv)，我们开启 --timing 以支持 wait 和 # 延迟
        # 对于普通 RTL (.v)，我们保持严格的 Wall 检查
        find . -type f \( -name "*.v" -o -name "*.sv" \) \
          -not -path "./.git/*" \
          -not -path "*/obj_dir/*" \
          | while read file; do
            echo "Checking $file"
            
            # 判断是否为 Testbench 文件
            if [[ $file == *"tb_"* ]]; then
              # Testbench 检查：允许 timing，忽略延迟警告
              verilator --lint-only -Wall --timing -Wno-STMTDLY $INC_FLAGS "$file" || exit 1
            else
              # 普通 RTL 检查：相对严格
              verilator --lint-only -Wall --no-timing $INC_FLAGS "$file" || exit 1
            fi
          done

    - name: Check Tcl syntax (basic)
      run: |
        # 简单的 Tcl 语法检查（使用 tclsh -c）
        find . -type f -name "*.tcl" \
          -not -path "./.git/*" \
          | while read file; do
            echo "Checking Tcl $file"
            if ! tclsh -c "exit 0" < "$file" 2>/dev/null; then
              echo "Tcl syntax error in $file"
              exit 1
            fi
          done

    - name: Check Python syntax
      run: |
        find . -type f -name "*.py" \
          -not -path "./.git/*" \
          | while read file; do
            echo "Checking Python $file"
            python3 -m py_compile "$file" || exit 1
          done